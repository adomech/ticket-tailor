limit_req_zone $binary_remote_addr zone=payments_api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=payments_api burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }
    error_page 403 = @method_not_allowed;
    location @method_not_allowed {
        add_header Allow GET always;
        default_type application/json;
        return 405 '{"message":"Method not allowed.","reference":"$request_id"}';
    }
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"message":"Too many requests.","reference":"$request_id"}';
    }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ /index.html;
    }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 15s;
    }
}
