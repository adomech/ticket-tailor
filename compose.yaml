services:
  php:
    build: { context: ., dockerfile: docker/php.Dockerfile }
    user: "82:82"
    environment:
      RECORDS_PATH: /app/data/records.json
      LOG_LEVEL: warning
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on:
      php: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8080"]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
  frontend-dev:
    profiles: [dev]
    build: { context: ., dockerfile: docker/node-dev.Dockerfile }
    volumes: ["./frontend/src:/app/src"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [php]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
